# LIPPS browser authoring configuration
# GitHub repository is now locked to the LIPPS account/repository below.
backend:
  name: github
  repo: carepointpro-Lipps/Lipps
  branch: main

publish_mode: editorial_workflow
media_folder: assets/uploads
public_folder: /assets/uploads

# Production domain intentionally omitted until the LIPPS domain is selected.
# Add site_url and display_url here once the public domain is live.
logo_url: /assets/lipps-mark.svg

collections:
  - name: lipps_content
    label: LIPPS Content
    label_singular: Page
    delete: false
    files:
      - name: home
        label: "Homepage"
        file: index.qmd
        format: qmd
        fields:
          - { name: _raw_frontmatter, label: Internal front matter, widget: hidden, required: false }
          - { name: title, label: Internal title, widget: string, required: false }
          - { name: pagetitle, label: Browser page title, widget: string, required: false }
          - { name: description, label: Description, widget: text, required: false }
          - { name: page-layout, label: Page layout, widget: hidden, default: full, required: false }
          - { name: body, label: Page content, widget: markdown }
