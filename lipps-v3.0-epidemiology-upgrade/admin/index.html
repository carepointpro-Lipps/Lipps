<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#171715">
  <title>LIPPS Admin</title>
  <style>
    :root{--ink:#171715;--ivory:#f6f1e7;--paper:#fffdf7;--ochre:#a9671e;--stone:#6e685e}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ivory);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #lipps-loading{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:linear-gradient(135deg,#f8f4eb,#efe6d6);color:var(--ink);transition:opacity .25s ease}
    .load-card{width:min(560px,calc(100vw - 40px));padding:44px;border:1px solid rgba(23,23,21,.12);border-radius:24px;background:rgba(255,253,247,.9);box-shadow:0 24px 70px rgba(55,43,25,.12)}
    .mark{display:flex;align-items:center;gap:14px;font-weight:900;font-size:30px;letter-spacing:-.04em}.dot{width:12px;height:12px;border-radius:50%;background:var(--ochre);box-shadow:0 0 0 7px rgba(169,103,30,.12)}
    .strap{margin-top:8px;color:var(--stone);font-family:Georgia,serif;font-style:italic}.rule{height:1px;background:rgba(23,23,21,.12);margin:28px 0 18px}.small{font-size:13px;color:var(--stone)}
  </style>
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <div id="lipps-loading"><div class="load-card"><div class="mark"><span class="dot"></span>LIPPS ADMIN</div><div class="strap">Evidence is never the whole story.</div><div class="rule"></div><div class="small">Loading the editorial workspace…</div></div></div>
  <div id="nc-root"></div>
  <script src="https://unpkg.com/js-yaml@4/dist/js-yaml.min.js"></script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <script>
    CMS.registerCustomFormat('qmd', 'qmd', {
      fromFile: (text) => {
        text = text.replace(/^\uFEFF/, '');
        let frontMatter = {};
        let body = text;
        const match = text.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)([\s\S]*)$/);
        if (match) {
          frontMatter = jsyaml.load(match[1]) || {};
          body = match[2];
        }
        return {...frontMatter, _raw_frontmatter: JSON.stringify(frontMatter), body};
      },
      toFile: (data) => {
        const {body = '', _raw_frontmatter = '', ...edited} = data;
        let frontMatter = {};
        try { frontMatter = _raw_frontmatter ? JSON.parse(_raw_frontmatter) : {}; } catch (_) { frontMatter = {}; }
        for (const [key, value] of Object.entries(edited)) {
          if ((value === undefined || value === null || value === '') && !(key in frontMatter)) continue;
          frontMatter[key] = value;
        }
        const yaml = jsyaml.dump(frontMatter, {noRefs:true,lineWidth:-1,sortKeys:false});
        return `---\n${yaml}---\n${body}`;
      }
    });

    CMS.registerPreviewStyle('preview.css');

    const LippsPreview = createClass({
      render: function () {
        const {entry, widgetFor} = this.props;
        const title = entry.getIn(['data','title']) || entry.getIn(['data','pagetitle']) || 'LIPPS';
        const desc = entry.getIn(['data','description']) || '';
        const status = entry.getIn(['data','status']) || 'published';
        const author = entry.getIn(['data','author']) || 'LIPPS';
        return h('main',{className:'lipps-preview'},
          h('header',{className:'lp-header'},
            h('div',{className:'lp-kicker'},'LIPPS · EDITORIAL PREVIEW'),
            h('h1',{},title),
            desc && h('p',{className:'lp-deck'},desc),
            h('div',{className:'lp-meta'},
              h('span',{className:'lp-status'},status),
              h('span',{},`Author: ${author}`)
            )
          ),
          h('article',{className:'lp-body'},widgetFor('body')),
          h('footer',{className:'lp-footer'},'Evidence is never the whole story.')
        );
      }
    });

    ['site_pages','epidemiology','epidemiology_ii','health_communication','assessments','methods','projects'].forEach((name)=>CMS.registerPreviewTemplate(name,LippsPreview));

    document.getElementById('lipps-loading')?.remove();
    CMS.init();
  </script>
</body>
</html>
