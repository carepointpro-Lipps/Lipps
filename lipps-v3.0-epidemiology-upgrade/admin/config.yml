# LIPPS Admin v2.3 — structured browser authoring
backend:
  name: github
  repo: carepointpro-Lipps/Lipps
  branch: main
app_title: LIPPS Admin
site_url: https://carepointpro-lipps.github.io/Lipps/
display_url: https://carepointpro-lipps.github.io/Lipps/
